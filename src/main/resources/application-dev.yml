debug: true

logging:
    level:
        root: INFO
        web: DEBUG
        org:
            springframework:
                boot:
                    autoconfigure: ERROR
        com:
            github:
                nnbros:
                    rtp: DEBUG
    file:
        path: ""
        name: ""

spring:
    datasource:
        hikari:
            maximumPoolSize: 10
            minimumIdle: 5
            idleTimeout: 30000  # 30 sec
            maxLifetime: 300000  # 5 min
            keepaliveTime: 30000  # 30 sec
            connectionTimeout: 30000  # 30 sec
        url: jdbc:postgresql://localhost:5432/rtp
        username: gateway
        password: gateway

    cloud:
        openfeign:
            client:
                config:
                    storyteller:
                        url: http://localhost:8085
                    pve:
                        url: http://localhost:8090
rtp-bot:
    webhook-enabled: false
gateway:
    user:
        lock:
            ttl: PT1M
        unregistered:
            ttl: PT10M